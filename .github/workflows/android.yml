name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests und Debug-APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Testanzahl prüfen
        run: |
          dir=app/build/test-results/testDebugUnitTest
          if [ ! -d "$dir" ]; then
            echo "Keine Testergebnisse unter $dir gefunden."
            exit 1
          fi
          sum() { grep -ho "$1=\"[0-9]\+\"" "$dir"/*.xml | grep -o '[0-9]\+' | awk '{s+=$1} END {print s+0}'; }
          total=$(sum tests); failed=$(sum failures); errored=$(sum errors); skipped=$(sum skipped)
          echo "$total Tests, $failed Fehler, $errored Errors, $skipped übersprungen"
          if [ "$total" -eq 0 ]; then
            echo "Es wurden 0 Tests ausgeführt — das ist kein grüner Lauf."
            exit 1
          fi

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: einkaufsliste-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
